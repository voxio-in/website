<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Voxio Agents">
  <!-- The site's own ground, so the tab icon sits in the same world as the page
       behind it rather than reading as a sticker on top of it. -->
  <rect width="64" height="64" rx="14" fill="#03171c"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
  <!-- Set rather than drawn, matching the navbar mark. A generic sans stack on
       purpose: a favicon renders at 16px in a tab, where the difference between
       one grotesque and another is a pixel nobody sees, and a webfont here
       would be a request that blocks the tab icon. -->
  <text x="32" y="33" fill="#ffffff"
        font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="1"
        text-anchor="middle" dominant-baseline="central">VA</text>
</svg>
