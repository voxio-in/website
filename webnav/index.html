<style>
  body { background: #000; }

  /* ---------- liquid glass ----------
     The visible edge is drawn by the ::before ring rather than a border: a real
     border sits outside the backdrop-filter and reads as a hard line, while a
     masked gradient ring catches light only at top and bottom, which is what
     makes the chrome look like a lens instead of a box. */
  .liquid-glass {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.45) 0%,
      rgba(255, 255, 255, 0.15) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.15) 80%,
      rgba(255, 255, 255, 0.45) 100%);
    /* Two identical layers, one clipped to the content box, composited with xor
       so only the 1.4px padding ring survives. */
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    pointer-events: none;
  }

  .liquid-glass-strong {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(50px);
    -webkit-backdrop-filter: blur(50px);
    border: none;
    box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass-strong::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.5) 0%,
      rgba(255, 255, 255, 0.2) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.2) 80%,
      rgba(255, 255, 255, 0.5) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;

<!-- FadingVideo.js -->
<script type="text/babel" data-presets="react">
  // FadingVideo — a looping background clip that crossfades over its own seam.
  //
  // The loop is driven manually rather than with the `loop` attribute: a native
  // loop cuts hard from the last frame to the first, and there is no event to hang
  // a fade on. Instead the clip fades out just before it ends, restarts, and fades
  // back in, so the seam reads as a dissolve.
  //
  // Opacity is animated with requestAnimationFrame and not a CSS transition. Fades
  // here get interrupted (a fade-out can be cut short by a restart), and a CSS
  // transition restarted mid-flight jumps to its declared start value; reading the
  // live opacity each time makes every fade resume from wherever the last stopped.

  const FADE_MS = 500;
  /** Seconds before the end at which the fade-out begins. */
  const FADE_OUT_LEAD = 0.55;

  function FadingVideo({ src, className, style }) {
    const videoRef = React.useRef(null);
    const rafRef = React.useRef(0);
    const timeoutRef = React.useRef(0);
    const fadingOutRef = React.useRef(false);

    React.useEffect(() => {
      const video = videoRef.current;
      if (!video) return;

      const fadeTo = (target, duration) => {
        // Drop any fade already in flight, or two rAF loops fight over opacity.
        cancelAnimationFrame(rafRef.current);
        const from = parseFloat(video.style.opacity) || 0;
        const start = performance.now();
        const step = (now) => {
          const t = Math.min(1, (now - start) / duration);
          video.style.opacity = String(from + (target - from) * t);
          if (t < 1) rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
      };

      // Autoplay can still be refused (a power-saving profile, a paused tab); the
      // rejection is expected and must not surface as an unhandled rejection.
      const play = () => {
        const p = video.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      };

      const onLoadedData = () => {
        video.style.opacity = '0';
        play();
        fadeTo(1, FADE_MS);
      };

      const onTimeUpdate = () => {
        if (fadingOutRef.current) return;
        const remaining = video.duration - video.currentTime;
        // The `> 0` guard matters: duration is NaN until metadata lands, and NaN
        // comparisons would otherwise leave this either never or always true.
        if (remaining <= FADE_OUT_LEAD && remaining > 0) {
          fadingOutRef.current = true;
          fadeTo(0, FADE_MS);
        }
      };

      const onEnded = () => {
        video.style.opacity = '0';
        // A beat at zero opacity: restarting in the same frame as the last one
        // painted can flash the final frame before the seek takes effect.
        timeoutRef.current = window.setTimeout(() => {
          video.currentTime = 0;
          play();
          fadingOutRef.current = false;
          fadeTo(1, FADE_MS);
        }, 100);
      };

      video.addEventListener('loadeddata', onLoadedData);
      video.addEventListener('timeupdate', onTimeUpdate);
      video.addEventListener('ended', onEnded);

      return () => {
        cancelAnimationFrame(rafRef.current);
        window.clearTimeout(timeoutRef.current);
        video.removeEventListener('loadeddata', onLoadedData);
        video.removeEventListener('timeupdate', onTimeUpdate);
        video.removeEventListener('ended', onEnded);
      };
    }, [src]);

    return (
      <video
        ref={videoRef}
        src={src}
        autoPlay
        muted
        playsInline
        preload="auto"
        aria-hidden="true"
        className={className}
        style={{ opacity: 0, ...style }}
      />
    );
  }

  window.FadingVideo = FadingVideo;
</script>

<!-- BlurText.js -->
<script type="text/babel" data-presets="react">
  // BlurText — headline that resolves word by word out of a blur.
  //
  // Each word runs the same three-step keyframe track, offset by 100ms, so the line
  // sharpens left to right rather than all at once.

  const BLUR_STEP_DURATION = 0.35;

  function BlurText({ text, className }) {
    const { motion } = window.Motion;
    const ref = React.useRef(null);
    const [inView, setInView] = React.useState(false);

    React.useEffect(() => {
      const el = ref.current;
      if (!el) return;
      if (typeof IntersectionObserver !== 'function') {
        setInView(true);
        return;
      }
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            setInView(true);
            io.disconnect(); // one-way: the headline never re-blurs
          });
        },
        { threshold: 0.1 },
      );
      io.observe(el);
      return () => io.disconnect();
    }, []);

    const words = text.split(' ');

    return (
      <p
        ref={ref}
        className={className}
        style={{
          display: 'flex',
          flexWrap: 'wrap',
          justifyContent: 'center',
          rowGap: '0.1em',
        }}
      >
        {words.map((word, i) => (
          <motion.span
            key={`${word}-${i}`}
            initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
            animate={
              inView
                ? {
                    filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                    opacity: [0, 0.5, 1],
                    y: [50, -5, 0],
                  }
                : undefined
            }
            transition={{
              duration: BLUR_STEP_DURATION * 2,
              times: [0, 0.5, 1],
              ease: 'easeOut',
              delay: (i * 100) / 1000,
            }}
            // A margin, not a space character: the headline's -4px letter-spacing
            // collapses an inter-word space to almost nothing.
            style={{ display: 'inline-block', marginRight: '0.28em' }}
          >
            {word}
          </motion.span>
        ))}
      </p>
    );
  }

  window.BlurText = BlurText;
</script>
